<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrazyZerg</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      pointer-events: none;
      z-index: 100;
    }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hud-section {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #4a0e4e;
      border-radius: 8px;
      padding: 12px 20px;
      color: white;
    }

    .health-bar {
      width: 250px;
    }

    .health-bar-inner {
      height: 20px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .health-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff4444);
      transition: width 0.2s;
    }

    .health-text {
      font-size: 14px;
      color: #ccc;
    }

    .stat-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .wave-info {
      text-align: center;
    }

    .kills-info {
      text-align: right;
    }

    #game-over {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .game-over-content {
      text-align: center;
      color: white;
    }

    .game-over-content h1 {
      font-size: 48px;
      color: #ff4444;
      margin-bottom: 20px;
    }

    .game-over-content p {
      font-size: 24px;
      margin: 10px 0;
    }

    .restart-btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 20px;
      background: #4a0e4e;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
    }

    .restart-btn:hover {
      background: #6a2e6e;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-bar">
      <div class="hud-section health-bar">
        <div class="stat-label">Health</div>
        <div class="health-bar-inner">
          <div class="health-bar-fill" id="health-fill"></div>
        </div>
        <div class="health-text" id="health-text">500 / 500</div>
      </div>

      <div class="hud-section wave-info">
        <div class="stat-label">Wave</div>
        <div class="stat-value" id="wave-number">0</div>
      </div>

      <div class="hud-section kills-info">
        <div class="stat-label">Kills</div>
        <div class="stat-value" id="kills-count">0</div>
      </div>
    </div>
  </div>

  <div id="game-over">
    <div class="game-over-content">
      <h1>GAME OVER</h1>
      <p>Wave: <span id="final-wave">0</span></p>
      <p>Kills: <span id="final-kills">0</span></p>
      <p>Time: <span id="final-time">0:00</span></p>
      <button class="restart-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
